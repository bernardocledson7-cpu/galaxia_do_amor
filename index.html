<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Galáxia do Amor ❤️</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Tela inicial -->

    <div class="start-screen" id="startScreen">

        <h1>❤️ Uma surpresa ❤️</h1>

        <p>
            Preparei um pequeno universo especialmente
            para você.
        </p>

        <button onclick="enterGalaxy()">
            ✨ Entrar na galáxia ✨
        </button>

    </div>


    <!-- Galáxia -->

    <main class="galaxy">

        <canvas id="stars"></canvas>

        <h1 class="title">
            Te Amo
        </h1>


        <!-- Coração -->

        <div class="heart">
            ♥
        </div>


        <!-- Centro da galáxia -->

        <div class="galaxy-center">

            <div class="ring ring1"></div>

            <div class="ring ring2"></div>

            <div class="ring ring3"></div>

            <div class="black-hole"></div>

        </div>


        <!-- Mensagens -->

        <section class="messages">

            <h2>
                Para você, meu amor ❤️
            </h2>

            <div class="phrases">

                <span>✨ Você é meu universo</span>

                <span>💗 Minha pessoa favorita</span>

                <span>🌙 Minha paz</span>

                <span>💕 Minha felicidade</span>

                <span>⭐ Meu amor</span>

            </div>

            <p class="special-message">

                Em meio a bilhões de estrelas,
                eu escolheria você novamente. ❤️

            </p>

        </section>


        <!-- Botão -->

        <button class="love-button"
                onclick="createManyHearts()">

            💕 Clique aqui

        </button>

    </main>


    <script src="script.js"></script>

</body>

</html>
